name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with .claude/hooks/session-start.sh so pubspec.lock matches.
  FLUTTER_VERSION: '3.47.6'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: |
          args=(--release --build-number=${{ github.run_number }})
          # Tag pushes (v1.2.3) set the app version; manual runs keep pubspec.yaml's.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--build-name="${GITHUB_REF_NAME#v}")
          fi
          flutter build apk "${args[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk build/weatherapp.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: weatherapp/build/weatherapp.apk

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: weatherapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: |
          args=(--release --build-number=${{ github.run_number }})
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--build-name="${GITHUB_REF_NAME#v}")
          fi
          flutter build macos "${args[@]}"
          # ditto keeps the bundle's symlinks and ad-hoc signature intact; plain zip breaks them.
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/weatherapp.app build/weatherapp-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-macos
          path: weatherapp/build/weatherapp-macos.zip

  publish:
    if: github.ref_type == 'tag'
    needs: [build-apk, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/weatherapp.apk
            dist/weatherapp-macos.zip
          generate_release_notes: true
