name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'weatherapp/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'weatherapp/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with .claude/hooks/session-start.sh so pubspec.lock matches.
  FLUTTER_VERSION: '3.47.6'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build web
        # Pages serves the site from /<repo>/, so assets must resolve under that path.
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: weatherapp/build/web

  deploy:
    # Pull requests only check that the site builds; main publishes it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
